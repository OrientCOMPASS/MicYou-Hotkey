# Cross-compilation helper for the Windows GNU target (local dev only).
# CI builds Windows natively on windows-latest (MSVC); this file only makes
# `cargo build --target x86_64-pc-windows-gnu` work from Linux boxes
# (requires `apt-get install mingw-w64`).
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
